services:
  # Бэкенд на Laravel
  backend:
    build:
      context: ./prodagi_elmera_backend
      dockerfile: Dockerfile
    volumes:
      - ./prodagi_elmera_backend:/var/www/html
    depends_on:
      - db

  phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: always
        ports:
          - "8081:80" # Мы вешаем его на порт 8081, чтобы не конфликтовать с сайтом
        environment:
          PMA_HOST: db # Имя сервиса вашей базы данных из этого же файла
          MYSQL_ROOT_PASSWORD: root # Пароль, который вы указали для db
        depends_on:
          - db

  # Веб-сервер Nginx
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8000:80"
    volumes:
      - ./prodagi_elmera_backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Если у тебя есть папка nginx с конфигами в корне проекта:
      # - ./nginx/conf.d:/etc/nginx/conf.d 
    depends_on:
      - backend

  # Фронтенд на React
  frontend:
    build:
      context: ./prodagi_tg_frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./prodagi_tg_frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    tty: true
    stdin_open: true
    command: npm run dev

  # База данных
  db:
    image: mysql:8.0
    restart: always
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: prodagi_elmera
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

volumes:
  frontend_node_modules:
